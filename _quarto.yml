project:
  type: book

book:
  title: "Smertefri masterskriving -- en bok for lærerstudenter"
  author: "Roar Bakken Stovner"
    #date: "2023-02-21"
  date-format: "DD.MM.YYYY"
  language: nb
  license: "CC BY 4.0"

  page-footer:
    left: _Tips til masterskriving for lærerstudenter_ er skrevet av Roar Bakken Stovner
    right: Boka er skrevet med <a href="https://quarto.org/">Quarto</a>

  site-url: https://robast.quarto.pub/mastertips/
  repo-url: https://git.cs.oslomet.no/robast/mastertips

  google-analytics: "G-917RCTRH1N"
    #anonymize-ip: TRUE

  chapters:
    - index.qmd
    - kapitler/intro.qmd
    - part: "Generelle tips til mastergraden"
      chapters:
        - kapitler/tidsplan.qmd
        - kapitler/sammenheng.qmd
        - kapitler/veilederen.qmd
        - kapitler/skrivefilosofi.qmd
        - kapitler/generelle_skrivetips.qmd 
    - part: "Tips til hvert kapittel"
      chapters:
        - kapitler/kap_introduksjon.qmd
        - kapitler/kap_teori.qmd
        - kapitler/kap_metode.qmd
        - kapitler/kap_resultat.qmd
        - kapitler/kap_diskusjon.qmd
        - kapitler/kap_konklusjon.qmd

    - kapitler/summary.qmd
    - references.qmd


bibliography: references.bib
csl: apa.csl

format:
  html:
    number-depth: 1
    theme:
      light: breezy
      dark: darkly
    link-external-newwindow: true
      #pdf:
      #number-depth: 1
  docx:
    toc: true
    number-depth: 1
    link-citations: true
